name: Build ChessVision APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ChessVision ZIP
        run: |
          unzip -o ChessVision_0.1.0_source.zip -d extracted
          cp -r extracted/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          gradle --version
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessVision-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

name: Build ChessVision 0.5.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Получение исходного кода
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Проверка структуры проекта
      - name: Verify project structure
        run: |
          set -e
          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "Project structure verified"

      # 3. Подготовка каталогов ресурсов
      - name: Prepare assets
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/jniLibs/arm64-v8a

      # 4. Установка Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Установка Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Загрузка Stockfish
      - name: Download Stockfish
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-android-arm64-universal.tar.gz \
            -o /tmp/stockfish.tar.gz

          mkdir -p /tmp/stockfish
          tar -xzf /tmp/stockfish.tar.gz -C /tmp/stockfish

          ENGINE="$(find /tmp/stockfish -type f \
            -name 'stockfish-android-arm64*' | head -n 1)"

          if [ -z "$ENGINE" ]; then
            ENGINE="$(find /tmp/stockfish -type f \
              -name 'stockfish*' -perm /111 | head -n 1)"
          fi

          if [ -z "$ENGINE" ]; then
            echo "::error::Stockfish executable was not found in the archive"
            find /tmp/stockfish -maxdepth 4 -type f
            exit 1
          fi

          install -m 755 "$ENGINE" \
            app/src/main/jniLibs/arm64-v8a/libstockfish.so

          LICENSE="$(find /tmp/stockfish -type f \
            \( -iname 'Copying.txt' -o -iname 'LICENSE*' \) | head -n 1)"

          if [ -n "$LICENSE" ]; then
            cp "$LICENSE" app/src/main/assets/STOCKFISH_LICENSE.txt
          fi

          file app/src/main/jniLibs/arm64-v8a/libstockfish.so

      # 7. Загрузка модели распознавания шахматных фигур
      - name: Download chess model
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 4 --retry-delay 3 \
            https://huggingface.co/NAKSTStudio/yolov8m-chess-piece-detection/resolve/main/best_f16.tflite \
            -o app/src/main/assets/chess_pieces.tflite

          echo "2bfabe22f91266a2308a7df29c2a22afbbdb537fb2040ef8c93f6ed4fc144033  app/src/main/assets/chess_pieces.tflite" \
            | sha256sum -c -

          test -s app/src/main/assets/chess_pieces.tflite

      # 8. Проверка скачанных ресурсов
      - name: Verify assets
        run: |
          set -e
          ls -lh app/src/main/assets/
          ls -lh app/src/main/jniLibs/arm64-v8a/
          test -s app/src/main/assets/chess_pieces.tflite
          test -s app/src/main/jniLibs/arm64-v8a/libstockfish.so

      # 9. Сборка APK
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      # 10. Проверка результата
      - name: Verify APK
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      # 11. Сохранение APK в артефактах GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessVision-0.5.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

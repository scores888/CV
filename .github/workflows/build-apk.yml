
name: Build ChessVision APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o ChessVision_0.2.0_source.zip -d project
          cp -r project/. .

      - name: Download Stockfish ARM64
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 \
            https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-android-arm64-universal.tar.gz \
            -o /tmp/stockfish.tar.gz
          mkdir -p /tmp/sf
          tar -xzf /tmp/stockfish.tar.gz -C /tmp/sf
          ENGINE="$(find /tmp/sf -type f -name 'stockfish*' | head -n 1)"
          test -n "$ENGINE"
          cp "$ENGINE" app/src/main/assets/stockfish
          chmod 755 app/src/main/assets/stockfish

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ChessVision-0.2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk

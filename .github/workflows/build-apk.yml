name: Build ChessVision 0.5.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Получение исходников
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Распаковка проекта
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ChessVision_0.5.2_arrow_touchfix.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Архив $ZIP не найден в корне репозитория."
            echo "Файлы репозитория:"
            ls -la
            exit 1
          fi

          mkdir -p /tmp/chessvision-project
          unzip -q -o "$ZIP" -d /tmp/chessvision-project

          SETTINGS="$(find /tmp/chessvision-project -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::В архиве не найден settings.gradle(.kts)."
            find /tmp/chessvision-project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Найден проект: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

      # 3. Проверка структуры
      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Структура проекта проверена."

      # 4. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Каталоги ресурсов
      - name: Prepare assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/jniLibs/arm64-v8a

      # 7. Загрузка Stockfish
      - name: Download Stockfish
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-android-arm64-universal.tar.gz" \
            -o /tmp/stockfish.tar.gz

          mkdir -p /tmp/stockfish
          tar -xzf /tmp/stockfish.tar.gz -C /tmp/stockfish

          ENGINE="$(find /tmp/stockfish -type f \
            -name 'stockfish-android-arm64*' -print -quit)"

          if [ -z "$ENGINE" ]; then
            ENGINE="$(find /tmp/stockfish -type f \
              -name 'stockfish*' -perm /111 -print -quit)"
          fi

          if [ -z "$ENGINE" ]; then
            echo "::error::Исполняемый файл Stockfish не найден."
            find /tmp/stockfish -maxdepth 4 -type f
            exit 1
          fi

          install -m 755 "$ENGINE" \
            app/src/main/jniLibs/arm64-v8a/libstockfish.so

          LICENSE="$(find /tmp/stockfish -type f \
            \( -iname 'Copying.txt' -o -iname 'LICENSE*' \) \
            -print -quit)"

          if [ -n "$LICENSE" ]; then
            cp "$LICENSE" \
              app/src/main/assets/STOCKFISH_LICENSE.txt
          fi

          echo "Stockfish подготовлен."
          file app/src/main/jniLibs/arm64-v8a/libstockfish.so

      # 8. Загрузка модели
      - name: Download chess model
        shell: bash
        run: |
          set -euo pipefail

          MODEL="app/src/main/assets/chess_pieces.tflite"

          curl -fL --retry 4 --retry-delay 3 \
            "https://huggingface.co/NAKSTStudio/yolov8m-chess-piece-detection/resolve/main/best_f16.tflite" \
            -o "$MODEL"

          echo "2bfabe22f91266a2308a7df29c2a22afbbdb537fb2040ef8c93f6ed4fc144033  $MODEL" \
            | sha256sum -c -

          test -s "$MODEL"

          echo "Модель распознавания загружена."

      # 9. Проверка ресурсов
      - name: Verify assets
        shell: bash
        run: |
          set -euo pipefail

          test -s app/src/main/assets/chess_pieces.tflite
          test -s app/src/main/jniLibs/arm64-v8a/libstockfish.so

          ls -lh app/src/main/assets/
          ls -lh app/src/main/jniLibs/arm64-v8a/

      # 10. Проверка Gradle
      - name: Validate Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle tasks --stacktrace

      # 11. Сборка APK
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleDebug --stacktrace

      # 12. Проверка APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK не найден."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"
          file "$APK"

      # 13. Публикация APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessVision-0.5.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

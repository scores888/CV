
name: Build ChessVision APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o ChessVision_0.3.6_source.zip -d project
          cp -r project/. .

      - name: Download Stockfish ARM64
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fL --retry 3 \
            https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-android-arm64-universal.tar.gz \
            -o /tmp/stockfish.tar.gz
          mkdir -p /tmp/sf
          tar -xzf /tmp/stockfish.tar.gz -C /tmp/sf
          ENGINE="$(find /tmp/sf -type f -name 'stockfish-android-arm64*' | head -n 1)"
          if [ -z "$ENGINE" ]; then
            ENGINE="$(find /tmp/sf -type f -name 'stockfish*' -perm /111 | head -n 1)"
          fi
          test -n "$ENGINE"
          file "$ENGINE"
          cp "$ENGINE" app/src/main/jniLibs/arm64-v8a/libstockfish.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessVision-0.3.6-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

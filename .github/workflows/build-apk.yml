
name: Build ChessVision 0.4.4 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o ChessVision_0.4.4_source.zip -d project
          cp -r project/. .

      - name: Prepare assets
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/jniLibs/arm64-v8a

      - name: Download Stockfish
        run: |
          curl -fL --retry 3 \
            https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-android-arm64-universal.tar.gz \
            -o /tmp/stockfish.tar.gz
          mkdir -p /tmp/sf
          tar -xzf /tmp/stockfish.tar.gz -C /tmp/sf
          ENGINE="$(find /tmp/sf -type f -name 'stockfish-android-arm64*' | head -n 1)"
          if [ -z "$ENGINE" ]; then
            ENGINE="$(find /tmp/sf -type f -name 'stockfish*' -perm /111 | head -n 1)"
          fi
          test -n "$ENGINE"
          cp "$ENGINE" app/src/main/jniLibs/arm64-v8a/libstockfish.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libstockfish.so
          LICENSE="$(find /tmp/sf -type f \( -iname 'Copying.txt' -o -iname 'LICENSE*' \) | head -n 1)"
          if [ -n "$LICENSE" ]; then
            cp "$LICENSE" app/src/main/assets/STOCKFISH_LICENSE.txt
          fi

      - name: Download chess model
        run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://huggingface.co/NAKSTStudio/yolov8m-chess-piece-detection/resolve/main/best_f16.tflite \
            -o app/src/main/assets/chess_pieces.tflite
          echo "2bfabe22f91266a2308a7df29c2a22afbbdb537fb2040ef8c93f6ed4fc144033  app/src/main/assets/chess_pieces.tflite" | sha256sum -c -
          test -s app/src/main/assets/chess_pieces.tflite

      - name: Verify model
        run: |
          ls -lh app/src/main/assets/
          test -s app/src/main/assets/chess_pieces.tflite

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessVision-0.4.4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
